<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="250" height="250">
  <!-- Фон -->
  <rect width="250" height="250" rx="40" fill="#1a1a1a"/>

  <!-- Скроллбар (трек) -->
  <rect x="185" y="40" width="18" height="170" rx="9" fill="#2a2a2a" stroke="#c0a0ff" stroke-width="3" opacity="0.7"/>
  <!-- Ползунок скроллбара вверху -->
  <rect x="185" y="40" width="18" height="52" rx="9" fill="#c0a0ff" opacity="0.85"/>

  <!-- Кнопка "наверх" — круг -->
  <circle cx="112" cy="148" r="62" fill="#2a2a2a" stroke="#c0a0ff" stroke-width="5"/>

  <!-- Стрелка вверх -->
  <polyline points="112,178 112,118" stroke="#c0a0ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <polyline points="82,148 112,118 142,148" stroke="#c0a0ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Черта "топ" над стрелкой -->
  <line x1="82" y1="108" x2="142" y2="108" stroke="#c0a0ff" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
</svg>
